name: DOAB metadata pilot (dry-run only)

on:
  push:
    branches:
      - app/minimal-vercel-foundation
    paths:
      - .github/workflows/doab-pilot.yml
      - scripts/fetch-doab-json-feed.mjs
      - scripts/doab-json-feed-core.mjs
      - scripts/doab-import-core.mjs
      - scripts/import-doab.mjs
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of records (1–500)
        required: true
        default: "25"
        type: string
      all_languages:
        description: Include all DOAB languages (otherwise FR/EN/ES/PT plus unknown languages)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: doab-metadata-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-and-dry-run:
    if: ${{ github.ref == 'refs/heads/app/minimal-vercel-foundation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the application branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect from the official DOAB CC0 JSON feed
        env:
          DOAB_LIMIT: ${{ inputs.limit || '25' }}
          DOAB_ALL_LANGUAGES: ${{ inputs.all_languages || 'false' }}
        run: |
          if [ "$DOAB_ALL_LANGUAGES" = "true" ]; then
            node scripts/fetch-doab-json-feed.mjs \
              --limit "$DOAB_LIMIT" \
              --all-languages \
              --output ./doab-batch.json
          else
            node scripts/fetch-doab-json-feed.mjs \
              --limit "$DOAB_LIMIT" \
              --output ./doab-batch.json
          fi

      - name: Run importer in dry-run mode
        env:
          DOAB_LIMIT: ${{ inputs.limit || '25' }}
        run: |
          node scripts/import-doab.mjs \
            --input ./doab-batch.json \
            --max-records "$DOAB_LIMIT" \
            --dry-run > ./doab-dry-run.log 2>&1
          cat ./doab-dry-run.log

      - name: Preserve source batch and dry-run report
        uses: actions/upload-artifact@v4
        with:
          name: doab-pilot-${{ github.run_id }}
          path: |
            doab-batch.json
            doab-dry-run.log
          if-no-files-found: error
          retention-days: 7
